databases:
  - name: django-accounts-db
    plan: free
    databaseName: django_accounts
    user: django_accounts

services:
  - type: web
    name: Pro
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-accounts-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: CLOUDFLARE_TUNNEL_TOKEN
        sync: false
      - key: IP_HASH_SALT
        sync: false
