{% extends 'base.html' %}

{% block title %}Профиль{% endblock %}

{% block content %}
<section class="profile">
    <h1>Профиль</h1>
    <dl>
        <div>
            <dt>Имя пользователя</dt>
            <dd>{{ user.username }}</dd>
        </div>
        <div>
            <dt>Email</dt>
            <dd>{{ user.email|default:'Не указан' }}</dd>
        </div>
        <div>
            <dt>Дата регистрации</dt>
            <dd>{{ user.date_joined|date:'d.m.Y H:i' }}</dd>
        </div>
    </dl>
    <p style="margin-top:24px"><a href="{% url 'home' %}" class="secondary">← Перейти в чат</a></p>
</section>
{% endblock %}
