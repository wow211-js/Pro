{% extends 'base.html' %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
<section class="auth-panel">
    <h1>Смена пароля</h1>
    <p class="muted">После смены пароля потребуется заново активировать E2E шифрование в диалогах.</p>
    <form method="post" class="auth-form">
        {% csrf_token %}
        <label>
            <span>Текущий пароль</span>
            <input type="password" name="old_password" required autofocus>
        </label>
        <label>
            <span>Новый пароль</span>
            <input type="password" name="new_password" required minlength="8">
        </label>
        <label>
            <span>Повторите новый пароль</span>
            <input type="password" name="confirm_password" required>
        </label>
        {% for message in messages %}
            <strong class="error">{{ message }}</strong>
        {% endfor %}
        <button type="submit">Сменить пароль</button>
    </form>
    <p class="muted" style="margin-top:16px"><a href="{% url 'profile' %}">← Назад в профиль</a></p>
</section>
{% endblock %}
